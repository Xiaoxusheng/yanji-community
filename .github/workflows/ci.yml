name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 构建/检查/测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: gofmt 检查
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（单元）
        run: go test ./... -count=1

  integration:
    name: 集成 · 真实 PG18 + Redis8 端到端
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yanji
          POSTGRES_PASSWORD: yanji_dev_password
          POSTGRES_DB: yanji_community_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yanji -d yanji_community_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: 端到端集成测试（迁移 000001-000009 + 全业务链路断言）
        run: go test ./tests/... -tags integration -v -count=1 -timeout 8m
        env:
          TEST_DATABASE_URL: postgres://yanji:yanji_dev_password@127.0.0.1:5432/yanji_community_test?sslmode=disable

  frontend:
    name: 前端 · Lint/类型/构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: eslint
        run: npm run lint
      - name: next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
