services:
  postgres:
    image: postgres:18-alpine
    container_name: yanji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yanji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yanji_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yanji_community}
      TZ: UTC
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: yanji-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: yanji-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-yanji}:${POSTGRES_PASSWORD:-yanji_dev_password}@postgres:5432/${POSTGRES_DB:-yanji_community}?sslmode=disable
      REDIS_ADDR: redis:6379
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_PUBLIC_BASE: ${STORAGE_PUBLIC_BASE:-/files}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@2024}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/data/uploads

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        API_INTERNAL_BASE_URL: http://api:8080/api/v1
    container_name: yanji-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      API_INTERNAL_BASE_URL: http://api:8080/api/v1
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: yanji-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  uploads_data:
