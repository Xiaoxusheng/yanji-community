services:
  postgres:
    image: postgres:18-alpine
    container_name: yanji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yanji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yanji_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yanji_community}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: yanji-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: yanji-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-yanji}:${POSTGRES_PASSWORD:-yanji_dev_password}@postgres:5432/${POSTGRES_DB:-yanji_community}?sslmode=disable
      REDIS_ADDR: redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
      MAIL_DRIVER: log
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@2024}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/data/uploads

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: yanji-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      API_INTERNAL_BASE_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
