server {
    listen 80;
    server_name _;  # 替换为你的域名，如 community.example.com
    server_tokens off;

    client_max_body_size 12M;  # 略大于 UPLOAD_MAX_BYTES（10MB）

    # 全站基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 后端 API
    location /api/ {
        proxy_pass http://yanji-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 强制使用边缘直连 IP，防止客户端伪造 X-Forwarded-For 绕过限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # SSE 实时通知（长连接，禁止缓冲）
    location /api/v1/me/notifications/stream {
        proxy_pass http://yanji-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # 本地上传静态文件（禁用脚本执行；显式补全安全响应头，避免 location 级 add_header 覆盖 server 级配置）
    location /files/ {
        proxy_pass http://yanji-api:8080;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    # 健康检查端点
    location /healthz {
        proxy_pass http://yanji-api:8080;
    }
    location /readyz {
        proxy_pass http://yanji-api:8080;
    }

    # 前端 Next.js
    location / {
        proxy_pass http://yanji-web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
